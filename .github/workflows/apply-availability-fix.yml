name: Apply availability fix

on:
  push:
    paths:
      - ".github/workflows/apply-availability-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: availability-fix
          fetch-depth: 0

      - name: Patch bot.js
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot.js")
          text = path.read_text()

          old = '''function parseLaunchDate(text) {
            if (!text) {
              return null;
            }

            const match =
              String(text).match(
                /Launches\\s+([A-Za-z]+\\s+\\d{1,2},\\s+\\d{4}\\s+\\d{1,2}:\\d{2}\\s*(?:am|pm)\\s*PT)/i
              );

            return match
              ? match[1]
              : null;
          }'''

          new = '''function parseUpcomingInfo(text) {
            if (!text) {
              return {
                upcoming: false,
                launchDate: null
              };
            }

            const source = String(text);

            const launchMatch = source.match(
              /Launches\\s+([A-Za-z]+\\s+\\d{1,2},\\s+\\d{4}(?:\\s+\\d{1,2}:\\d{2}\\s*(?:am|pm)\\s*PT)?)/i
            );

            if (launchMatch) {
              return {
                upcoming: true,
                launchDate: launchMatch[1]
              };
            }

            const shipMatch = source.match(
              /Ships\\s+(?:on\\s+or\\s+before|on)\\s+([A-Za-z]+\\s+\\d{1,2},\\s+\\d{4})/i
            );

            if (shipMatch) {
              return {
                upcoming: true,
                launchDate: shipMatch[1]
              };
            }

            if (/\\bpre[-\\s]?order\\b/i.test(source)) {
              return {
                upcoming: true,
                launchDate: null
              };
            }

            if (/\\bcoming\\s+soon\\b/i.test(source)) {
              return {
                upcoming: true,
                launchDate: null
              };
            }

            return {
              upcoming: false,
              launchDate: null
            };
          }'''

          if old not in text:
              raise SystemExit("parseLaunchDate block not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              '''    result.explicitlySoldOut =
      lower.includes("sold out") ||
      lower.includes("out of stock") ||
      lower.includes("unavailable");''',
              '''    result.explicitlySoldOut =
      lower.includes("sold out") ||
      lower.includes("out of stock");''',
              1
          )

          old = '''    if (checkLaunch) {
      result.launchDate =
        parseLaunchDate(html);

      result.upcoming =
        Boolean(
          result.launchDate
        );
    }'''

          new = '''    if (checkLaunch) {
      const upcomingInfo =
        parseUpcomingInfo(html);

      result.launchDate =
        upcomingInfo.launchDate;

      result.upcoming =
        upcomingInfo.upcoming;
    }'''

          if old not in text:
              raise SystemExit("checkLaunch block not found")
          text = text.replace(old, new, 1)

          old = '''      const previousHiddenAlertSent =
        existing
          ? existing.hiddenAlertSent === true
          : false;

      const available ='''

          new = '''      const previousHiddenAlertSent =
        existing
          ? existing.hiddenAlertSent === true
          : false;

      const previousUpcoming =
        existing
          ? existing.upcoming === true
          : false;

      const available ='''

          if old not in text:
              raise SystemExit("previous state block not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              '''          pageInfo =
          await fetchProductPageInfo(
            raw.handle,
            shouldCheckLaunch
          );''',
              '''          pageInfo =
          await fetchProductPageInfo(
            raw.handle,
            true
          );''',
              1
          )

          old = '''        // =========================
        // RESTOCK
        // =========================

        if (
          previousAvailable === false &&'''

          new = '''        // =========================
        // UPCOMING / PRE-ORDER TRANSITION
        // =========================

        if (
          previousUpcoming === false &&
          product.upcoming === true &&
          !record.upcomingAlertSent &&
          previousLastScanAt
        ) {

          record.upcomingAlertSent = true;

          addAlert(
            alerts,
            `🚀 ${product.title}`
          );

          await sendToChannel(
            channel,

            makeEmbed(
              "🚀 UPCOMING / PRE-ORDER",
              0xffa500,
              product,
              [
                {
                  name: "📦 Product",
                  value:
                    product.title
                },
                {
                  name: "🚀 Release / Ship Date",
                  value:
                    product.launchDate ||
                    "Pre-order / Coming Soon",
                  inline: true
                },
                {
                  name: "💲 Price",
                  value:
                    `$${product.price || "Unknown"}`,
                  inline: true
                }
              ]
            )
          );
        }

        // =========================
        // RESTOCK
        // =========================

        if (
          previousAvailable === false &&'''

          if old not in text:
              raise SystemExit("restock anchor not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              '''          !product.explicitlySoldOut &&
          !product.launchDate''',
              '''          !product.explicitlySoldOut &&
          !product.upcoming &&
          !product.launchDate''',
              1
          )

          text = text.replace(
              '''            !product.explicitlySoldOut &&
            !product.launchDate''',
              '''            !product.explicitlySoldOut &&
            !product.upcoming &&
            !product.launchDate''',
              1
          )

          path.write_text(text)
          print("availability-fix patch applied")
          PY

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-availability-fix.yml
          git add bot.js
          git commit -m "Improve preorder and upcoming product detection"
          git push origin availability-fix
